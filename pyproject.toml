[project]
name = "mesosfer"
version = "0.1.0"
description = "the minimal full-stack ChatGPT clone"
readme = "README.md"
# Upper bound is deliberate: uv solves every Python version in this range, and the
# ROCm/CUDA wheel indexes have no 3.14+ builds yet, so leaving it open makes
# `uv sync --extra rocm` fail on a split that nobody actually installs into.
requires-python = ">=3.12,<3.14"
dependencies = [
    "datasets>=4.0.0",
    "fastapi>=0.117.1",
    "kernels>=0.11.7",
    "psutil>=7.1.0",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "torch>=2.6.0,<3.0",
    "transformers>=4.57.3",
    "uvicorn>=0.36.0",
    "wandb>=0.21.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# torch index sources: CUDA 12.8, ROCm 7.2, or CPU.
# The ROCm index must match the driver on the host (check with `ls -d /opt/rocm-*`).
# ROCm wheels bundle their own runtime, so a 7.2 wheel is the right pick for any
# ROCm 7.x driver; older 6.x hosts should point this URL back at whl/rocm6.4.
# On images that already ship PyTorch at system level, create the venv with
# `uv venv --system-site-packages` so it is reused instead of downloaded again.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-rocm", extra = "rocm" },
]
# torch renamed its ROCm triton dependency at 2.11: <=2.10 pulls pytorch-triton-rocm
# (index stops at 3.5.1), >=2.11 pulls triton-rocm (3.6.0+). Both names are mapped so
# either torch generation resolves; the index is explicit=true, so an unmapped name
# fails with "no version of triton-rocm" instead of falling back to PyPI.
pytorch-triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [
    { index = "pytorch-rocm", extra = "rocm" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[project.optional-dependencies]
cpu = [
    "setuptools>=65.0.0",
    "torch>=2.6.0,<3.0",
]
cuda = [
    "torch>=2.6.0,<3.0",
]
gpu = [
    "torch>=2.6.0,<3.0",
]
rocm = [
    # triton is pulled in by torch itself, under whichever name that torch version uses
    # (see the sources note above). Pinning it here would force one of the two names.
    "torch>=2.6.0,<3.0",
]

[tool.uv]
default-groups = []
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cuda" },
        { extra = "gpu" },
        { extra = "rocm" },
    ],
]
